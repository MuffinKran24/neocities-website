<!DOCTYPE html>

<html>
  <head>
    <meta charset="UTF-8">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="Assets/damn.png">
  
    <style>
      .calc {
        width: 200px;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 15px;
      }

      #display {
        width: 100%;
        height: 40px;
        text-align: right;
        margin-bottom: 10px;
        font-size: 35px;
        border-radius: 10px;
      }

      .buttons {
        background-color: lavender;
        padding: 5px;
        border-radius: 10px;
      }

      button {
        width: 45px;
        height: 40px;
        margin: 2px;
        font-size: 20px;
      }
    </style>
  </head>

  <body>
    <h1>Calculator</h1>

    <p>I found an simple, old calculator on my hard drive</p>

    <div class="calc">
      <input type="text" id="display" disabled>
      <div class="buttons">
                       
        <button onclick="appendToDisplay('1')">1</button>
        <button onclick="appendToDisplay('2')">2</button>
        <button onclick="appendToDisplay('3')">3</button><br>
        <button onclick="appendToDisplay('4')">4</button>
        <button onclick="appendToDisplay('5')">5</button>
        <button onclick="appendToDisplay('6')">6</button><br>
        <button onclick="appendToDisplay('7')">7</button>
        <button onclick="appendToDisplay('8')">8</button>
        <button onclick="appendToDisplay('9')">9</button><br>
        <button onclick="appendToDisplay('0')">0</button>
        <button onclick="appendToDisplay('.')">.</button><br>
        
        <button class="operator" onclick="appendToDisplay('+')">+</button>
        <button class="operator" onclick="appendToDisplay('-')">-</button>
        <button class="operator" onclick="appendToDisplay('*')">×</button>
        <button class="operator" onclick="appendToDisplay('/')">/</button><br>
        
        <button class="equals" onclick="calculate()">=</button>    
        <button class="clear" onclick="clearDisplay()">C</button>
      </div>
    </div>
      
    <script>
      const display = document.getElementById('display');

      function appendToDisplay(input) {
        display.value += input;
      }

      function clearDisplay() {
        display.value = "";
      }

      function calculate() {
        try {
            display.value = eval(display.value);
        } catch (error) {
            display.value = "Error";
            setTimeout(clearDisplay, 1500);
        }
      }
    </script>

    <p>It even uses the eval function 💀</p>

    <div class="back">
      <a href="index.html" class="button">back</a>
    </div>
  </body>
</html>
